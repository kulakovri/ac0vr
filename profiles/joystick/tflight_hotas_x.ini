; T.Flight Hotas X
; UNVERIFIED: nobody has run this file on the real device. VID:PID from memory, not from a device.
; Axis numbers are SDL's: the device's DirectInput axes in the order X, Y, Z, Rx, Ry, Rz, Slider, Slider, skipping the
; ones it does not have. If an axis or button is wrong: F4 > Controller > Joysticks, or edit a copy in your settings file
; as [joystick:<GUID>]; then send the "joy:" lines of the log back (docs/HOTAS.md).
; Put the selector on PC before plugging in; install Thrustmaster's PC driver; the 5/8 axes mode (the guide
; button: LED off) keeps the rocker, the twist and the pedals apart. Open: is the lever Z (axis 2) or a Slider, the
; rocker the other one. The rocker (axis 4) is free: bind it as yaw instead of the twist if you prefer.

[profile]
name = T.Flight Hotas X
match = 044f:b108
match_name = T.Flight Hotas X
type = stick
status = unverified
counts = 5 12 1
axis0 = invert:0 dz:0.03 curve:1.0
axis1 = invert:0 dz:0.03 curve:1.0
axis2 = invert:1 dz:0.08 curve:1.0 slider:0 neutral:0.5
axis3 = invert:0 dz:0.08 curve:1.0
axis4 = invert:0 dz:0.08 curve:1.0
bind.roll = axis0
bind.pitch = axis1
bind.yaw = axis3
bind.throttle = axis2
bind.cross = button0
bind.circle = button1
bind.square = button2
bind.triangle = button3
bind.highg = button4
bind.autopilot = button5
bind.r3 = button6
bind.select = button7
bind.l3 = button8
bind.start = button9
bind.dpad = hat0
