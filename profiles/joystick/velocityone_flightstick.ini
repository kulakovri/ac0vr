; VelocityOne Flightstick
; UNVERIFIED: nobody has run this file on the real device. No VID:PID known (matched by name); PC (D-input) mode, axes from memory.
; Axis numbers are SDL's: the device's DirectInput axes in the order X, Y, Z, Rx, Ry, Rz, Slider, Slider, skipping the
; ones it does not have. If an axis or button is wrong: F4 > Controller > Joysticks, or edit a copy in your settings file
; as [joystick:<GUID>]; then send the "joy:" lines of the log back (docs/HOTAS.md).
; Choose PC mode in its OLED menu ("Legacy PC" where offered). Open: the Xbox mode's layout. Two levers on the base: the
; first is axis 3, the second free.

[profile]
name = VelocityOne Flightstick
match_name = VelocityOne Flightstick
type = stick
status = unverified
counts = 5 27 1
axis0 = invert:0 dz:0.03 curve:1.0
axis1 = invert:0 dz:0.03 curve:1.0
axis2 = invert:0 dz:0.08 curve:1.0
axis3 = invert:1 dz:0.08 curve:1.0 slider:0 neutral:0.5
axis4 = invert:1 dz:0.08 curve:1.0 slider:0 neutral:0.5
bind.roll = axis0
bind.pitch = axis1
bind.yaw = axis2
bind.throttle = axis3
bind.cross = button0
bind.circle = button1
bind.square = button2
bind.triangle = button3
bind.highg = button4
bind.autopilot = button5
bind.r3 = button6
bind.select = button7
bind.start = button8
bind.dpad = hat0
