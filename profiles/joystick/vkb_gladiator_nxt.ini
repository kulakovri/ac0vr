; VKB Gladiator NXT
; UNVERIFIED: nobody has run this file on the real device. 231d:0200 is in SDL's flight-stick list, 0201 from memory; axes from memory.
; Axis numbers are SDL's: the device's DirectInput axes in the order X, Y, Z, Rx, Ry, Rz, Slider, Slider, skipping the
; ones it does not have. If an axis or button is wrong: F4 > Controller > Joysticks, or edit a copy in your settings file
; as [joystick:<GUID>]; then send the "joy:" lines of the log back (docs/HOTAS.md).
; VKBDevCfg can rearrange everything: this assumes the factory profile. The throttle wheel is axis 2.

[profile]
name = VKB Gladiator NXT
match = 231d:0200,231d:0201
match_name = Gladiator
type = stick
status = unverified
counts = 4 32 1
axis0 = invert:0 dz:0.03 curve:1.0
axis1 = invert:0 dz:0.03 curve:1.0
axis2 = invert:1 dz:0.08 curve:1.0 slider:0 neutral:0.5
axis3 = invert:0 dz:0.08 curve:1.0
bind.roll = axis0
bind.pitch = axis1
bind.yaw = axis3
bind.throttle = axis2
bind.cross = button0
bind.circle = button1
bind.square = button2
bind.triangle = button3
bind.highg = button4
bind.r3 = button5
bind.select = button6
bind.start = button7
bind.dpad = hat0
