; Saitek X52
; UNVERIFIED: nobody has run this file on the real device. VID:PIDs from a Linux kernel commit; axis order from memory.
; Axis numbers are SDL's: the device's DirectInput axes in the order X, Y, Z, Rx, Ry, Rz, Slider, Slider, skipping the
; ones it does not have. If an axis or button is wrong: F4 > Controller > Joysticks, or edit a copy in your settings file
; as [joystick:<GUID>]; then send the "joy:" lines of the log back (docs/HOTAS.md).
; Lever axis 2 (Z), twist axis 5 (Rz), rotaries and the slider free. The lever's detents at 10 % and 90 % are
; not used: its neutral is 50 % until SET LEVER NEUTRAL.

[profile]
name = Saitek X52
match = 06a3:075c,06a3:0255
match_name = X52 
type = stick
status = unverified
counts = 7 34 1
axis0 = invert:0 dz:0.03 curve:1.0
axis1 = invert:0 dz:0.03 curve:1.0
axis2 = invert:1 dz:0.08 curve:1.0 slider:0 neutral:0.5
axis3 = invert:0 dz:0.10 curve:1.0
axis4 = invert:0 dz:0.10 curve:1.0
axis5 = invert:0 dz:0.08 curve:1.0
axis6 = invert:0 dz:0.10 curve:1.0
bind.roll = axis0
bind.pitch = axis1
bind.yaw = axis5
bind.throttle = axis2
bind.cross = button0
bind.circle = button1
bind.square = button2
bind.triangle = button3
bind.highg = button5
bind.autopilot = button7
bind.select = button6
bind.start = button8
bind.r3 = button9
bind.l3 = button10
bind.dpad = hat0
