; Winwing Orion 2 stick
; UNVERIFIED: nobody has run this file on the real device. No VID:PID known (matched by name); axes from memory.
; Axis numbers are SDL's: the device's DirectInput axes in the order X, Y, Z, Rx, Ry, Rz, Slider, Slider, skipping the
; ones it does not have. If an axis or button is wrong: F4 > Controller > Joysticks, or edit a copy in your settings file
; as [joystick:<GUID>]; then send the "joy:" lines of the log back (docs/HOTAS.md).
; SimAppPro's 4x32 mode shows four identical devices: each gets the same GUID (<GUID>:2 ... in the settings file).
; Its grips change the buttons. Throttle base: no profile yet; bind it in F4.

[profile]
name = Winwing Orion 2 stick
match_name = Orion
type = stick
status = unverified
counts = 2 32 1
axis0 = invert:0 dz:0.03 curve:1.0
axis1 = invert:0 dz:0.03 curve:1.0
bind.roll = axis0
bind.pitch = axis1
bind.cross = button0
bind.circle = button1
bind.square = button2
bind.triangle = button3
bind.highg = button4
bind.r3 = button5
bind.select = button6
bind.start = button7
bind.dpad = hat0
