; HOTAS Warthog Joystick
; UNVERIFIED: nobody has run this file on the real device. VID:PID: SDL's flight-stick list; buttons from memory.
; Axis numbers are SDL's: the device's DirectInput axes in the order X, Y, Z, Rx, Ry, Rz, Slider, Slider, skipping the
; ones it does not have. If an axis or button is wrong: F4 > Controller > Joysticks, or edit a copy in your settings file
; as [joystick:<GUID>]; then send the "joy:" lines of the log back (docs/HOTAS.md).
; No twist: yaw comes from the throttle's coolie hat (warthog_throttle.ini) or pedals.

[profile]
name = HOTAS Warthog Joystick
match = 044f:0402
match_name = Warthog Joystick
type = stick
status = unverified
counts = 2 19 1
axis0 = invert:0 dz:0.03 curve:1.0
axis1 = invert:0 dz:0.03 curve:1.0
bind.roll = axis0
bind.pitch = axis1
bind.cross = button0
bind.circle = button1
bind.triangle = button2
bind.square = button3
bind.highg = button4
bind.r3 = button5
bind.select = button6
bind.start = button7
bind.dpad = hat0
