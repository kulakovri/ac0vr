; TWCS Throttle
; UNVERIFIED: nobody has run this file on the real device. VID:PID from a forum log of TARGET; axis order from memory of other games' presets.
; Axis numbers are SDL's: the device's DirectInput axes in the order X, Y, Z, Rx, Ry, Rz, Slider, Slider, skipping the
; ones it does not have. If an axis or button is wrong: F4 > Controller > Joysticks, or edit a copy in your settings file
; as [joystick:<GUID>]; then send the "joy:" lines of the log back (docs/HOTAS.md).
; Lever axis 2 (Z), paddle axis 5 (Rz, yaw), mini-stick axes 0 and 1 (look), antenna rotary free. Pedals through the
; RJ12 port add axes to this device.

[profile]
name = TWCS Throttle
match = 044f:b687
match_name = TWCS
type = throttle
status = unverified
counts = 8 14 1
axis0 = invert:0 dz:0.10 curve:1.0
axis1 = invert:0 dz:0.10 curve:1.0
axis2 = invert:1 dz:0.08 curve:1.0 slider:0 neutral:0.5
axis5 = invert:0 dz:0.08 curve:1.0
bind.throttle = axis2
bind.yaw = axis5
bind.look_x = axis0
bind.look_y = axis1
bind.highg = button0
bind.autopilot = button1
bind.accel = button2
bind.brake = button3
