; T.Flight Rudder Pedals (USB)
; UNVERIFIED: nobody has run this file on the real device. VID:PID from a forum post; axis order from memory.
; Axis numbers are SDL's: the device's DirectInput axes in the order X, Y, Z, Rx, Ry, Rz, Slider, Slider, skipping the
; ones it does not have. If an axis or button is wrong: F4 > Controller > Joysticks, or edit a copy in your settings file
; as [joystick:<GUID>]; then send the "joy:" lines of the log back (docs/HOTAS.md).
; Rudder axis 2 (Rz), toe brakes axes 0 and 1, free (accel / brake in SPLIT if you like).

[profile]
name = T.Flight Rudder Pedals
match = 044f:b679
match_name = Rudder Pedals
type = pedals
status = unverified
counts = 3 0 0
axis0 = invert:0 dz:0.05 slider:1
axis1 = invert:0 dz:0.05 slider:1
axis2 = invert:0 dz:0.08 curve:1.0
bind.yaw = axis2
