; T.16000M (stick)
; UNVERIFIED: nobody has run this file on the real device. VID:PID: SDL's flight-stick list and a forum log; axis order from the layout.
; Axis numbers are SDL's: the device's DirectInput axes in the order X, Y, Z, Rx, Ry, Rz, Slider, Slider, skipping the
; ones it does not have. If an axis or button is wrong: F4 > Controller > Joysticks, or edit a copy in your settings file
; as [joystick:<GUID>]; then send the "joy:" lines of the log back (docs/HOTAS.md).
; The base slider is the lever only while no TWCS (a device of type throttle) is connected.

[profile]
name = T.16000M
match = 044f:b10a
match_name = T.16000M
type = stick
status = unverified
counts = 4 16 1
axis0 = invert:0 dz:0.03 curve:1.0
axis1 = invert:0 dz:0.03 curve:1.0
axis2 = invert:0 dz:0.08 curve:1.0
axis3 = invert:1 dz:0.08 curve:1.0 slider:0 neutral:0.5
bind.roll = axis0
bind.pitch = axis1
bind.yaw = axis2
bind.throttle = axis3
bind.cross = button0
bind.circle = button1
bind.square = button2
bind.triangle = button3
bind.highg = button4
bind.autopilot = button5
bind.r3 = button6
bind.select = button7
bind.l3 = button8
bind.start = button9
bind.dpad = hat0
