; HOTAS Warthog Throttle
; UNVERIFIED: nobody has run this file on the real device. VID:PID: SDL's throttle list; axis order from memory.
; Axis numbers are SDL's: the device's DirectInput axes in the order X, Y, Z, Rx, Ry, Rz, Slider, Slider, skipping the
; ones it does not have. If an axis or button is wrong: F4 > Controller > Joysticks, or edit a copy in your settings file
; as [joystick:<GUID>]; then send the "joy:" lines of the log back (docs/HOTAS.md).
; CENTRED: the right lever (axis 2) around its neutral. SPLIT: right lever accelerates, left lever (axis 3) brakes.
; Yaw on the coolie hat, left / right. The lever's idle detent is not its neutral by default: SET LEVER NEUTRAL.

[profile]
name = HOTAS Warthog Throttle
match = 044f:0404
match_name = Warthog Throttle
type = throttle
status = unverified
counts = 5 32 1
axis0 = invert:0 dz:0.10 curve:1.0
axis1 = invert:0 dz:0.10 curve:1.0
axis2 = invert:1 dz:0.08 curve:1.0 slider:1 neutral:0.5
axis3 = invert:1 dz:0.05 curve:1.0 slider:1 neutral:0.5
bind.throttle = axis2
bind.accel = axis2
bind.brake = axis3
bind.look_x = axis0
bind.look_y = axis1
bind.l2 = hat0:left
bind.r2 = hat0:right
bind.highg = button0
bind.autopilot = button1
